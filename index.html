<title>Purushothaman Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: one terminal window floating over a full-screen animated canvas.
   Output scrolls down the page; the prompt stays at the end of the output. */
:root {
  --bg: #08120d;
  --panel: rgba(8, 18, 13, 0.80);
  --bar: rgba(14, 30, 22, 0.92);
  --line: #1f3a2b;
  --fg: #d3e8d9;
  --muted: #6f907b;
  --accent: #7bd88f;
  --warm: #e6b95a;
  --link: #9fe3b0;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html[data-mode="neural"] {
  --bg: #070d18;
  --panel: rgba(7, 13, 24, 0.80);
  --bar: rgba(12, 22, 40, 0.92);
  --line: #1b3050;
  --fg: #d6e4f5;
  --muted: #6f87a6;
  --accent: #5cc8ff;
  --warm: #ffb86b;
  --link: #8fd8ff;
}
html[data-mode="off"] {
  --bg: #0c0d0f;
  --panel: rgba(14, 15, 18, 0.96);
  --bar: rgba(22, 23, 27, 1);
  --line: #2a2c33;
  --fg: #dcdde2;
  --muted: #80838f;
  --accent: #6cd49a;
  --warm: #e6b95a;
  --link: #9ad9b6;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--mono);
  font-size: 14px;
  line-height: 1.6;
  padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100vh;
}
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }

.win {
  position: relative; z-index: 1;
  max-width: 980px; margin: 0 auto;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  overflow: hidden;
}
.bar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 14px;
  background: var(--bar);
  border-bottom: 1px solid var(--line);
}
.dots { display: flex; gap: 7px; }
.dots i { width: 11px; height: 11px; border-radius: 50%; background: var(--line); display: block; }
.dots i:first-child { background: var(--accent); }
.title { color: var(--muted); font-size: 12.5px; flex: 1 1 200px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.modes { display: flex; gap: 4px; }
.modes button {
  font: inherit; font-size: 12px; color: var(--muted);
  background: transparent; border: 1px solid var(--line); border-radius: 5px;
  padding: 3px 10px; cursor: pointer;
}
.modes button:hover { color: var(--fg); border-color: var(--muted); }
.modes button[aria-pressed="true"] { color: var(--bg); background: var(--accent); border-color: var(--accent); }

.screen { padding: 18px 20px 22px; }
.login { color: var(--muted); font-size: 12.5px; margin-bottom: 14px; }

.line { margin-top: 18px; overflow-wrap: anywhere; }
.line:first-of-type { margin-top: 0; }
.ps { color: var(--accent); font-weight: 700; }
.ps .at { color: var(--muted); font-weight: 400; }
.cmdtext { color: var(--fg); }
.block { margin-top: 10px; overflow-wrap: anywhere; }
.block a { color: var(--link); text-underline-offset: 3px; }
.block a:hover { color: var(--warm); }
.dim { color: var(--muted); }
.ok { color: var(--accent); }
.warn { color: var(--warm); }
.err { color: #ff8f8f; }

/* neofetch block */
.fetch { display: grid; grid-template-columns: 172px minmax(0, 1fr); gap: 24px; align-items: start; }
.shot { margin: 0; border: 1px solid var(--accent); padding: 5px; background: rgba(0, 0, 0, 0.25); }
.shot img { display: block; width: 100%; height: auto; aspect-ratio: 2 / 3; object-fit: cover; object-position: top; }
.info h1 { margin: 0; font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; }
.role { margin: 4px 0 14px; color: var(--accent); font-size: 15px; }
dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 18px; margin: 0; }
dl.kv dt { color: var(--accent); }
dl.kv dd { margin: 0; }
.bio { margin: 14px 0 0; max-width: 62ch; color: var(--fg); }

/* generic rows */
.rows { display: grid; gap: 6px 18px; grid-template-columns: max-content minmax(0, 1fr); }
.rows .k { color: var(--accent); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { border: 1px solid var(--line); border-radius: 4px; padding: 0 8px; font-size: 12.5px; }

/* projects */
.plist { display: grid; gap: 8px; }
.proj {
  font: inherit; color: inherit; text-align: left; cursor: pointer;
  display: grid; grid-template-columns: 2.6em minmax(0, 1fr); gap: 0 6px;
  background: rgba(255, 255, 255, 0.02); border: 1px solid var(--line); border-radius: 6px;
  padding: 10px 12px;
}
.proj:hover { border-color: var(--accent); background: rgba(255, 255, 255, 0.05); }
.proj .idx { color: var(--muted); grid-row: span 2; }
.proj .pname { color: var(--fg); font-weight: 700; display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.proj .pdesc { color: var(--muted); font-size: 13px; }
.badge { font-size: 11px; font-weight: 500; color: var(--bg); background: var(--warm); border-radius: 3px; padding: 0 6px; }
.detail { border-left: 2px solid var(--accent); padding-left: 14px; max-width: 70ch; }
.detail h2 { margin: 0 0 6px; font-size: 18px; }

/* helper chips + input */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 22px; }
.chip {
  font: inherit; font-size: 12.5px; color: var(--link); cursor: pointer;
  background: transparent; border: 1px solid var(--line); border-radius: 5px; padding: 2px 10px;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
form.prompt { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
form.prompt label { white-space: nowrap; }
#cmd {
  flex: 1 1 auto; min-width: 0; font: inherit; color: var(--fg);
  background: transparent; border: 0; outline: 0; caret-color: var(--accent); padding: 4px 0;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#cmd:focus-visible { outline: 0; }
form.prompt:focus-within { box-shadow: 0 1px 0 var(--accent); }

@media (max-width: 640px) {
  body { font-size: 13px; padding-block: 16px 28px; }
  .screen { padding: 14px 14px 18px; }
  .fetch { grid-template-columns: 1fr; gap: 16px; }
  .shot { max-width: 170px; }
  .info h1 { font-size: 24px; }
  .rows, dl.kv { grid-template-columns: 1fr; gap: 0; }
  .rows .k, dl.kv dt { margin-top: 8px; }
  .ps .host { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<canvas id="fx" aria-hidden="true"></canvas>

<main class="win">
  <div class="bar">
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="title">purushothaman@portfolio: ~</div>
    <div class="modes" role="group" aria-label="Background animation">
      <button type="button" data-mode="forest" aria-pressed="true">forest</button>
      <button type="button" data-mode="neural" aria-pressed="false">neural</button>
      <button type="button" data-mode="off" aria-pressed="false">off</button>
    </div>
  </div>
  <div class="screen">
    <div class="login" id="login"></div>
    <div id="out" role="log" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <form class="prompt" id="form" autocomplete="off">
      <label for="cmd" class="ps">purushothaman<span class="at">@</span><span class="host">portfolio</span><span class="at">:~$</span></label>
      <input id="cmd" type="text" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Type a command, for example help">
    </form>
  </div>
</main>

        '<dt>based in</dt><dd>Tamil Nadu, India</dd></dl>' +
        '<p class="bio">I turn real requirements into working software: dashboards, admin-run web apps and tools that people use from the command line. Type <span class="ok">projects</span> to see the latest.</p></div></div>';
    },
    about: function () { return CMD.neofetch(); },
    whoami: function () { return CMD.neofetch(); },
    projects: function () {
      return '<div class="plist">' + PROJECTS.map(projRow).join('') + '</div><p class="dim">Select a project, or type project 1.</p>';
    },
    ls: function () { return CMD.projects(); },
    project: function (arg) {
      if (!arg) return CMD.projects();
      var n = parseInt(arg, 10), p = null;
      if (n >= 1 && n <= PROJECTS.length) p = PROJECTS[n - 1];
      else PROJECTS.forEach(function (x, i) { if (!p && x.name.toLowerCase().indexOf(arg.toLowerCase()) === 0) { p = x; n = i + 1; } });
      if (!p) return '<span class="err">No project matches "' + esc(arg) + '".</span> Type <span class="ok">projects</span> for the list.';
      return '<div class="detail"><h2>[' + n + '] ' + esc(p.name) + (p.badge ? ' <span class="badge">' + esc(p.badge) + '</span>' : '') + '</h2>' +
        '<p>' + esc(p.long) + '</p>' +
        (p.stack.length ? '<div class="rows"><span class="k">stack</span>' + tags(p.stack) + '</div>' : '') +
        (p.repo ? '<p><a href="' + p.repo + '" target="_blank" rel="noopener">View the repository on GitHub</a></p>' : '') + '</div>';
    },
    skills: function () {
      var g = [['frontend', ['React', 'JavaScript', 'HTML', 'CSS']], ['languages', ['Java', 'Python', 'C', 'SQL']],
        ['tooling', ['Vite', 'Vercel', 'Python CLI tools']], ['learning', ['Spring Boot', 'x86 assembly (NASM)']]];
      return '<div class="rows">' + g.map(function (r) { return '<span class="k">' + r[0] + '</span>' + tags(r[1]); }).join('') + '</div>';
    },
    experience: function () {
      return '<div class="rows"><span class="k">role</span><span>Intern, React App Development</span>' +
        '<span class="k">worked with</span>' + tags(['React', 'JavaScript', 'HTML', 'CSS']) + '</div>';
    },
    education: function () {
      return '<div class="rows"><span class="k">degree</span><span>B.Sc. Computer Science</span><span class="k">university</span><span>Madras University</span></div>';
    },
    certs: function () {
      return '<div class="rows"><span class="k">issuers</span>' + tags(['Oracle', 'IBM', 'Nan Mudhalvan', 'NPTEL']) + '</div>';
    },
    resume: function () {
      return '<p><a href="resume.pdf" target="_blank" rel="noopener">Open resume.pdf</a></p>';
    },
    contact: function () {
      return '<div class="rows"><span class="k">github</span><a href="https://github.com/purushoth2006-thehero" target="_blank" rel="noopener">github.com/purushoth2006-thehero</a>' +
        '<span class="k">location</span><span>Tamil Nadu, India</span></div>';
    },
    mode: function (arg) {
      if (['forest', 'neural', 'off'].indexOf(arg) === -1) return 'Usage: <span class="ok">mode forest</span>, <span class="ok">mode neural</span> or <span class="ok">mode off</span>.';
      setMode(arg);
      return 'Background set to <span class="ok">' + arg + '</span>.';
    },
    theme: function (a) { return CMD.mode(a); },
    exit: function () { return '<span class="dim">This session stays open. Type help to see what is available.</span>'; }
  };

  /* ---------- terminal ---------- */
  var promptHtml = '<span class="ps">purushothaman<span class="at">@</span>portfolio<span class="at">:~$</span></span> ';
  function echo(text) {
    var d = document.createElement('div'); d.className = 'line';
    d.innerHTML = promptHtml; var s = document.createElement('span'); s.className = 'cmdtext'; s.textContent = text; d.appendChild(s);
    out.appendChild(d);
  }
  function print(html) { var d = document.createElement('div'); d.className = 'block'; d.innerHTML = html; out.appendChild(d); }
  var history = [], hpos = 0;

  function run(raw, quiet) {
    var text = raw.trim(); if (!text) return;
    if (!quiet) { history.push(text); hpos = history.length; }
    echo(text);
    var parts = text.split(/\s+/), name = parts[0].toLowerCase(), arg = parts.slice(1).join(' ');
    if (name === 'clear') { out.innerHTML = ''; return; }
    if (CMD[name]) print(CMD[name](arg.toLowerCase() === arg ? arg : arg));
    else print('<span class="err">command not found: ' + esc(parts[0]) + '</span> Type <span class="ok">help</span> for the list.');
    if (!quiet) input.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  form.addEventListener('submit', function (e) { e.preventDefault(); var v = input.value; input.value = ''; run(v); });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowUp') { if (hpos > 0) { hpos--; input.value = history[hpos]; } e.preventDefault(); }
    else if (e.key === 'ArrowDown') { if (hpos < history.length - 1) { hpos++; input.value = history[hpos]; } else { hpos = history.length; input.value = ''; } e.preventDefault(); }
    else if (e.key === 'Tab') {
      e.preventDefault(); var v = input.value.toLowerCase(); if (!v) return;
      var m = COMMANDS.concat(['whoami', 'about']).filter(function (c) { return c.indexOf(v) === 0; });
      if (m.length === 1) input.value = m[0];
    }
  });
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-cmd]'); if (t) { run(t.getAttribute('data-cmd')); return; }
    if (e.target.closest('.win') && !e.target.closest('a,button,input') && !window.getSelection().toString() && window.matchMedia('(hover: hover)').matches) input.focus();
  });

  var chips = $('#chips');
  ['help', 'neofetch', 'projects', 'skills', 'experience', 'education', 'certs', 'resume', 'contact'].forEach(function (c) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.setAttribute('data-cmd', c); b.textContent = c; chips.appendChild(b);
  });
  $('#login').textContent = 'Last login: ' + new Date().toDateString() + ' on ttys001';

  /* ---------- animation ---------- */
  var canvas = $('#fx'), ctx = canvas.getContext('2d');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0, DPR = 1, mode = 'forest', raf = 0, last = 0, T = 0;
  var mouse = { x: -999, y: -999 };
  var layers = [], leaves = [], flies = [], nodes = [], pulses = [];
  var rnd = function (a, b) { return a + Math.random() * (b - a); };

  function build() {
    layers = [];
    var defs = [{ base: 0.70, hMin: 0.16, hMax: 0.26, step: 70, col: '#0d2418', amp: 3 },
                { base: 0.80, hMin: 0.22, hMax: 0.34, step: 86, col: '#0a1c13', amp: 5 },
                { base: 0.92, hMin: 0.30, hMax: 0.46, step: 120, col: '#06120c', amp: 8 }];
    defs.forEach(function (d) {
      var trees = [], x = -40;
      while (x < W + 60) { trees.push({ x: x + rnd(-14, 14), h: rnd(d.hMin, d.hMax) * H, w: rnd(0.16, 0.24), ph: rnd(0, 6.28) }); x += d.step * rnd(0.7, 1.2); }
      layers.push({ d: d, trees: trees });
    });
    leaves = []; var nl = Math.round(Math.min(46, W / 28));
    for (var i = 0; i < nl; i++) leaves.push(newLeaf(true));
    flies = []; var nf = Math.round(Math.min(46, W / 26));
    for (i = 0; i < nf; i++) flies.push({ x: rnd(0, W), y: rnd(H * 0.35, H * 0.95), ph: rnd(0, 6.28), sp: rnd(0.4, 1.1), r: rnd(1.2, 2.4), ox: rnd(0, 6.28) });
    nodes = []; var nn = Math.min(90, Math.floor(W * H / 15000));
    for (i = 0; i < nn; i++) nodes.push({ x: rnd(0, W), y: rnd(0, H), vx: rnd(-0.18, 0.18), vy: rnd(-0.18, 0.18), r: rnd(1.4, 2.6) });
    pulses = [];
  }
  function newLeaf(anywhere) {
    return { x: rnd(0, W), y: anywhere ? rnd(-20, H) : -20, vy: rnd(14, 34), vx: rnd(-8, 8), s: rnd(3, 6.5), rot: rnd(0, 6.28), vr: rnd(-1.4, 1.4), ph: rnd(0, 6.28), c: Math.random() < 0.4 ? '#c99a3c' : (Math.random() < 0.5 ? '#6fbf73' : '#3f8f55') };
  }
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build(); frame(0, true);
  }

  function pine(x, base, h, w, sway, col) {
    ctx.fillStyle = col;
    var tiers = 5, tw = h * w;
    ctx.fillRect(x - tw * 0.08, base - h * 0.08, tw * 0.16, h * 0.1);
    for (var k = 0; k < tiers; k++) {
      var f = k / tiers, top = base - h + f * h * 0.72, bot = top + h * 0.34;
      var half = tw * (0.35 + 0.17 * k), ax = x + sway * (1 - f * 0.55);
      ctx.beginPath(); ctx.moveTo(ax, top); ctx.lineTo(x + half + sway * 0.15 * (1 - f), bot); ctx.lineTo(x - half + sway * 0.15 * (1 - f), bot); ctx.closePath(); ctx.fill();
    }
  }
  function drawForest(dt) {
    var g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#061109'); g.addColorStop(0.6, '#0e2217'); g.addColorStop(1, '#123022');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    var m = ctx.createRadialGradient(W * 0.82, H * 0.16, 0, W * 0.82, H * 0.16, H * 0.45);
    m.addColorStop(0, 'rgba(190,235,200,0.16)'); m.addColorStop(1, 'rgba(190,235,200,0)');
    ctx.fillStyle = m; ctx.fillRect(0, 0, W, H);
    layers.forEach(function (L, li) {
      var base = L.d.base * H;
      ctx.fillStyle = L.d.col; ctx.fillRect(0, base - 2, W, H - base + 4);
      L.trees.forEach(function (t) { pine(t.x, base, t.h, t.w, Math.sin(T * 0.0007 + t.ph) * L.d.amp, L.d.col); });
      if (li < 2) {
        var fx = ((T * 0.012 * (li + 1)) % (W + 600)) - 300;
        var fog = ctx.createRadialGradient(fx, base - 20, 0, fx, base - 20, 360);
        fog.addColorStop(0, 'rgba(160,210,180,0.07)'); fog.addColorStop(1, 'rgba(160,210,180,0)');
        ctx.fillStyle = fog; ctx.fillRect(fx - 360, base - 380, 720, 760);
      }
    });
    flies.forEach(function (f) {
      f.x += Math.sin(T * 0.0004 * f.sp + f.ox) * 0.25; f.y += Math.cos(T * 0.0005 * f.sp + f.ph) * 0.18;
      if (f.x < -10) f.x = W + 10; if (f.x > W + 10) f.x = -10;
      var a = 0.25 + 0.75 * Math.max(0, Math.sin(T * 0.0016 * f.sp + f.ph));
      var gl = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 6);
      gl.addColorStop(0, 'rgba(230,240,140,' + (0.55 * a) + ')'); gl.addColorStop(1, 'rgba(230,240,140,0)');
      ctx.fillStyle = gl; ctx.fillRect(f.x - f.r * 6, f.y - f.r * 6, f.r * 12, f.r * 12);
      ctx.fillStyle = 'rgba(250,255,190,' + a + ')'; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 0.7, 0, 6.28); ctx.fill();
    });
    leaves.forEach(function (l, i) {
      l.y += l.vy * dt; l.x += (l.vx + Math.sin(T * 0.001 + l.ph) * 14) * dt; l.rot += l.vr * dt;
      if (l.y > H + 20 || l.x < -30 || l.x > W + 30) leaves[i] = newLeaf(false);
      ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.rot); ctx.fillStyle = l.c; ctx.globalAlpha = 0.8;
      ctx.beginPath(); ctx.ellipse(0, 0, l.s, l.s * 0.45, 0, 0, 6.28); ctx.fill(); ctx.restore();
    });
  }

  function drawNeural(dt) {
    var g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#060b16'); g.addColorStop(1, '#0b1a30');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    var d = Math.min(150, Math.max(100, W / 9)), d2 = d * d, i, j;
    nodes.forEach(function (n) {
      n.x += n.vx; n.y += n.vy;
      if (n.x < 0 || n.x > W) n.vx *= -1; if (n.y < 0 || n.y > H) n.vy *= -1;
      var mx = mouse.x - n.x, my = mouse.y - n.y, md = mx * mx + my * my;
      if (md < 30000 && md > 1) { n.x += mx * 0.0016; n.y += my * 0.0016; }
    });
    ctx.lineWidth = 1;
    for (i = 0; i < nodes.length; i++) for (j = i + 1; j < nodes.length; j++) {
      var a = nodes[i], b = nodes[j], dx = a.x - b.x, dy = a.y - b.y, q = dx * dx + dy * dy;
      if (q < d2) { ctx.strokeStyle = 'rgba(92,200,255,' + (0.22 * (1 - q / d2)) + ')'; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        if (pulses.length < 14 && Math.random() < 0.0009) pulses.push({ a: a, b: b, p: 0 }); }
    }
    nodes.forEach(function (n) { ctx.fillStyle = 'rgba(140,215,255,0.75)'; ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 6.28); ctx.fill(); });
    for (i = pulses.length - 1; i >= 0; i--) {
      var p = pulses[i]; p.p += dt * 0.9; if (p.p >= 1) { pulses.splice(i, 1); continue; }
      var x = p.a.x + (p.b.x - p.a.x) * p.p, y = p.a.y + (p.b.y - p.a.y) * p.p;
      var gl = ctx.createRadialGradient(x, y, 0, x, y, 14); gl.addColorStop(0, 'rgba(255,255,255,0.9)'); gl.addColorStop(0.3, 'rgba(92,200,255,0.5)'); gl.addColorStop(1, 'rgba(92,200,255,0)');
      ctx.fillStyle = gl; ctx.fillRect(x - 14, y - 14, 28, 28);
    }
  }

  function frame(ts, once) {
    var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016; last = ts; T = ts;
    if (mode === 'forest') drawForest(dt); else if (mode === 'neural') drawNeural(dt); else ctx.clearRect(0, 0, W, H);
    if (!once && !reduce && mode !== 'off' && !document.hidden) raf = requestAnimationFrame(frame); else raf = 0;
  }
  function start() { if (!raf && !reduce && mode !== 'off') { last = 0; raf = requestAnimationFrame(frame); } }

  function setMode(m) {
    mode = m; document.documentElement.setAttribute('data-mode', m);
    document.querySelectorAll('.modes button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-mode') === m)); });
    try { localStorage.setItem('portfolio-mode', m); } catch (e) {}
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    frame(0, true); start();
  }
  document.querySelectorAll('.modes button').forEach(function (b) { b.addEventListener('click', function () { setMode(b.getAttribute('data-mode')); }); });
  window.addEventListener('mousemove', function (e) { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) start(); });

  var saved = null; try { saved = localStorage.getItem('portfolio-mode'); } catch (e) {}
  if (['forest', 'neural', 'off'].indexOf(saved) !== -1) mode = saved;
  document.documentElement.setAttribute('data-mode', mode);
  document.querySelectorAll('.modes button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-mode') === mode)); });
  resize(); start();

  /* ---------- boot ---------- */
  run('neofetch', true);
  run('help', true);
})();
</script>
